[package]
name = "kformat-app"
version = "0.1.1"
edition.workspace = true
license.workspace = true

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
kformat-core = { path = "../core" }

[features]
# Headless end-to-end test hook (`--smoke <loop device>`); never enabled in releases.
smoke = []

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
