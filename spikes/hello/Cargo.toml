[package]
name = "kformat-spike-hello"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
zbus = "5"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
