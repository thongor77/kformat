<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>kformat</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cbcf2"/>
      <stop offset="1" stop-color="#1f6fb4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde6ee"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd8dc"/>
      <stop offset="0.5" stop-color="#f4f7f9"/>
      <stop offset="1" stop-color="#b8c4cb"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fdc84"/>
      <stop offset="1" stop-color="#1f9d55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <mask id="hole">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="388" r="17" fill="#000"/>
    </mask>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="452" rx="104" ry="15" fill="#0b2f52" opacity="0.38" filter="url(#soft)"/>

  <!-- USB connector -->
  <rect x="194" y="82" width="124" height="96" rx="12" fill="url(#metal)" stroke="#9fb0ba" stroke-width="5"/>
  <rect x="222" y="104" width="24" height="38" rx="4" fill="#37474f"/>
  <rect x="266" y="104" width="24" height="38" rx="4" fill="#37474f"/>

  <!-- stick body (lanyard hole cut out) -->
  <g mask="url(#hole)">
    <rect x="172" y="160" width="168" height="268" rx="38" fill="url(#body)"/>
  </g>
  <rect x="172" y="160" width="168" height="40" rx="20" fill="#000" opacity="0.06"/>

  <!-- "formatted and safe" badge -->
  <circle cx="256" cy="288" r="68" fill="#ffffff"/>
  <circle cx="256" cy="288" r="58" fill="url(#badge)"/>
  <path d="M227 290 L249 313 L290 264" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
